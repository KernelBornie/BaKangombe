<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BaKangombe – New Features (16 Modules)</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .logo {
      font-size: 1.8rem;
      font-weight: bold;
      color: #0066cc;
    }
    .nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #334155;
      font-weight: 500;
    }
    .nav a:hover {
      color: #0066cc;
    }
    .key-section {
      background: #f1f5f9;
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }
    .key-section input {
      flex: 2;
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
      font-family: monospace;
    }
    button {
      background: #0066cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 40px;
      cursor: pointer;
      font-weight: 500;
    }
    button.secondary {
      background: #475569;
    }
    .module-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 24px;
      margin-top: 20px;
    }
    .module-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 28px;
      padding: 20px;
      transition: 0.2s;
    }
    .module-card:hover {
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .module-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      border-left: 4px solid #0066cc;
      padding-left: 12px;
    }
    .action-group {
      background: #fafcff;
      border-radius: 20px;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #eef2f6;
    }
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
    }
    .action-btn {
      background: white;
      color: #0066cc;
      border: 1px solid #0066cc;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: 0.2s;
    }
    .action-btn:hover {
      background: #0066cc;
      color: white;
    }
    .action-inputs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .action-inputs input {
      flex: 1;
      min-width: 100px;
      padding: 8px 12px;
      border-radius: 40px;
      border: 1px solid #cbd5e1;
      font-size: 0.85rem;
    }
    .result-area {
      background: #f8fafc;
      border-radius: 16px;
      padding: 8px 12px;
      font-family: 'SF Mono', monospace;
      font-size: 0.75rem;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 150px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      margin-top: 8px;
    }
    .admin-section {
      background: #fef9e3;
      padding: 16px;
      border-radius: 24px;
      margin-top: 24px;
    }
    .flex-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    hr {
      margin: 20px 0;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">⚡ BaKangombe</div>
    <div class="nav">
      <a href="/">Home</a>
      <a href="/#pricing">Pricing</a>
      <a href="/#docs">Docs</a>
      <a href="/admin">Admin</a>
      <a href="/new-features" style="color:#0066cc; font-weight:bold;">New Features</a>
      <a href="#">GitHub</a>
    </div>
  </div>

  <div class="key-section">
    <strong>🔑 API Key:</strong>
    <input type="text" id="apiKeyInput" value="80af46c3cae0f0f2c66b4495eac2271a173bf2b9d063020e25fe3407f0ccb7d6" size="50">
    <button id="saveKeyBtn">💾 Save Key</button>
    <button id="registerBusinessBtn">🏢 Register New Business</button>
    <span id="keyStatus" style="color:green;"></span>
  </div>

  <div class="admin-section">
    <div class="flex-row">
      <button id="activateAllModulesBtn">⚡ Activate All Modules (One Click)</button>
      <button id="activateSingleSystemBtn">➕ Activate Single System</button>
      <button id="checkEnabledModulesBtn">🔍 Check Enabled Modules</button>
      <button id="enableMissingModulesBtn">🔧 Enable All Missing Modules</button>
    </div>
    <p style="font-size:0.8rem; margin-top: 10px;">Use after saving your API key. All endpoints require a valid API key. Save your key above, then test any module.</p>
  </div>

  <div id="modulesContainer" class="module-grid"></div>
</div>

<script>
  let API_KEY = localStorage.getItem('bakangombe_key') || '80af46c3cae0f0f2c66b4495eac2271a173bf2b9d063020e25fe3407f0ccb7d6';
  document.getElementById('apiKeyInput').value = API_KEY;
  document.getElementById('keyStatus').innerText = '✓ Key saved';

  document.getElementById('saveKeyBtn').onclick = () => {
    API_KEY = document.getElementById('apiKeyInput').value.trim();
    localStorage.setItem('bakangombe_key', API_KEY);
    document.getElementById('keyStatus').innerText = '✓ Key saved';
  };

  async function callApi(endpoint, body) {
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': API_KEY },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`HTTP ${res.status} - ${await res.text()}`);
    return await res.json();
  }

  // Define modules exactly as in the second screenshot
  const modules = [
    {
      title: "📱 1. Mobile Money",
      actions: [
        { label: "Send Money", endpoint: "/api/mobile-money/send", fields: ["amount","phone","provider"] },
        { label: "Request Money", endpoint: "/api/mobile-money/send", fields: ["amount","phone","provider"] },
        { label: "List Transactions", endpoint: "/api/mobile-money/list", fields: [] }
      ]
    },
    {
      title: "🧾 2. Invoice & ZRA Billing",
      actions: [
        { label: "Create Invoice", endpoint: "/api/invoice/create", fields: ["customer","amount","items"] },
        { label: "Pay Invoice", endpoint: "/api/invoice/pay", fields: ["invoice_id"] }
      ]
    },
    {
      title: "💬 3. WhatsApp Mini E‑commerce",
      actions: [
        { label: "Add Product", endpoint: "/api/whatsapp/product", fields: ["name","price","description"] },
        { label: "List Products", endpoint: "/api/whatsapp/products", fields: [] },
        { label: "Create Order", endpoint: "/api/whatsapp/order", fields: ["product_id","customer_phone"] }
      ]
    },
    {
      title: "🚚 4. Logistics & Delivery",
      actions: [
        { label: "Optimize Route", endpoint: "/api/logistics/route", fields: ["stops"] },
        { label: "Assign Driver", endpoint: "/api/logistics/assign", fields: ["route_id","driver_id"] },
        { label: "Track Driver", endpoint: "/api/logistics/track", fields: ["driver_id"] }
      ]
    },
    {
      title: "🌾 5. Agritech Marketplace",
      actions: [
        { label: "Add Farmer", endpoint: "/api/agritech/farmer", fields: ["farmer","crop","price","location"] },
        { label: "List Farmers", endpoint: "/api/agritech/farmers", fields: [] },
        { label: "Match Buyer", endpoint: "/api/agritech/match", fields: ["crop","max_price"] }
      ]
    },
    {
      title: "🤖 6. AI Customer Support",
      actions: [
        { label: "Ask AI", endpoint: "/api/ai/ask", fields: ["question"] },
        { label: "Train AI", endpoint: "/api/ai/train", fields: ["question","answer"] }
      ]
    },
    {
      title: "💰 7. Micro-Lending",
      actions: [
        { label: "Get Credit Score", endpoint: "/api/lending/score", fields: ["income","debt"] },
        { label: "Check Eligibility", endpoint: "/api/lending/check", fields: ["score","requested"] }
      ]
    },
    {
      title: "📊 8. SME Dashboard",
      actions: [
        { label: "Record Sale", endpoint: "/api/sme/sale", fields: ["amount","customer_id"] },
        { label: "Record Expense", endpoint: "/api/sme/expense", fields: ["amount","category"] },
        { label: "Get Profit", endpoint: "/api/sme/profit", fields: [] }
      ]
    },
    {
      title: "🏪 9. Inventory & POS",
      actions: [
        { label: "Add Product", endpoint: "/api/inventory/product", fields: ["name","price","stock"] },
        { label: "List Products", endpoint: "/api/inventory/products", fields: [] },
        { label: "Update Stock", endpoint: "/api/inventory/stock", fields: ["product_id","quantity"] },
        { label: "Record POS Sale", endpoint: "/api/inventory/sale", fields: ["product_id","quantity","method"] }
      ]
    },
    {
      title: "📢 10. Social Ads",
      actions: [
        { label: "Create Ad", endpoint: "/api/ads/create", fields: ["name","budget","target"] },
        { label: "List Ads", endpoint: "/api/ads/list", fields: [] },
        { label: "Update Budget", endpoint: "/api/ads/budget", fields: ["ad_id","new_budget"] },
        { label: "Get Leads", endpoint: "/api/ads/leads", fields: ["ad_id"] }
      ]
    },
    {
      title: "💼 11. Freelance Marketplace",
      actions: [
        { label: "Post Service", endpoint: "/api/freelance/service", fields: ["title","price","seller"] },
        { label: "List Services", endpoint: "/api/freelance/services", fields: [] },
        { label: "Create Order", endpoint: "/api/freelance/order", fields: ["service_id","buyer"] },
        { label: "Release Escrow", endpoint: "/api/freelance/release", fields: ["order_id"] }
      ]
    },
    {
      title: "🏥 12. Clinic Management",
      actions: [
        { label: "Add Patient", endpoint: "/api/clinic/patient", fields: ["name","phone","address"] },
        { label: "List Patients", endpoint: "/api/clinic/patients", fields: [] },
        { label: "Schedule Appointment", endpoint: "/api/clinic/appointment", fields: ["patient_id","date","reason"] },
        { label: "Get Bill", endpoint: "/api/clinic/bill", fields: ["patient_id"] }
      ]
    },
    {
      title: "🪪 13. Identity Verification (KYC)",
      actions: [
        { label: "Verify ID", endpoint: "/api/kyc/verify-id", fields: ["id_number","name"] },
        { label: "Verify Phone", endpoint: "/api/kyc/verify-phone", fields: ["phone"] }
      ]
    },
    {
      title: "🛒 14. E‑commerce BaaS",
      actions: [
        { label: "Add Product", endpoint: "/api/ecommerce/product", fields: ["name","price"] },
        { label: "List Products", endpoint: "/api/ecommerce/products", fields: [] },
        { label: "Create Order", endpoint: "/api/ecommerce/order", fields: ["product_id","quantity","customer"] },
        { label: "Process Payment", endpoint: "/api/ecommerce/pay", fields: ["order_id","method"] }
      ]
    },
    {
      title: "📚 15. AI Tutoring",
      actions: [
        { label: "Ask Tutor", endpoint: "/api/tutoring/ask", fields: ["question","grade"] },
        { label: "Get Curriculum", endpoint: "/api/tutoring/curriculum", fields: ["grade"] }
      ]
    },
    {
      title: "📍 16. Local Business Discovery",
      actions: [
        { label: "Add Business", endpoint: "/api/business/add", fields: ["name","category","location","whatsapp"] },
        { label: "Search Businesses", endpoint: "/api/business/search", fields: ["category"] },
        { label: "Add Review", endpoint: "/api/business/review", fields: ["business_id","rating","comment"] },
        { label: "Get WhatsApp Link", endpoint: "/api/business/whatsapp", fields: ["business_id"] }
      ]
    }
  ];

  const container = document.getElementById('modulesContainer');
  modules.forEach(mod => {
    const card = document.createElement('div');
    card.className = 'module-card';
    card.innerHTML = `<div class="module-title">${mod.title}</div>`;
    mod.actions.forEach((action, idx) => {
      const actionDiv = document.createElement('div');
      actionDiv.className = 'action-group';
      actionDiv.innerHTML = `
        <div class="action-buttons">
          <button class="action-btn" data-endpoint="${action.endpoint}" data-fields='${JSON.stringify(action.fields)}'>${action.label}</button>
        </div>
        <div class="action-inputs" id="inputs-${mod.title.replace(/ /g,'')}-${idx}">
          ${action.fields.map(f => `<input type="text" placeholder="${f}" data-field="${f}">`).join('')}
        </div>
        <div id="result-${mod.title.replace(/ /g,'')}-${idx}" class="result-area">Click button to see result</div>
      `;
      card.appendChild(actionDiv);
    });
    container.appendChild(card);
  });

  // Global event listener for action buttons
  document.body.addEventListener('click', async (e) => {
    if (!e.target.classList.contains('action-btn')) return;
    const btn = e.target;
    const endpoint = btn.dataset.endpoint;
    const fields = JSON.parse(btn.dataset.fields);
    // Find the parent .action-group
    const group = btn.closest('.action-group');
    const inputs = group.querySelectorAll('.action-inputs input');
    const body = {};
    inputs.forEach(input => {
      const fieldName = input.dataset.field;
      let val = input.value.trim();
      if (val === '') return;
      // Convert types
      if (['amount','price','stock','budget','rating','max_price','requested','income','debt'].includes(fieldName)) val = parseFloat(val);
      if (['quantity','product_id','service_id','order_id','ad_id','driver_id','route_id','patient_id','business_id','invoice_id'].includes(fieldName)) val = parseInt(val);
      body[fieldName] = val;
    });
    const resultDiv = group.querySelector('.result-area');
    resultDiv.innerHTML = '⏳ Calling API...';
    try {
      const result = await callApi(endpoint, body);
      resultDiv.innerHTML = JSON.stringify(result, null, 2);
    } catch (err) {
      resultDiv.innerHTML = `Error: ${err.message}`;
    }
  });

  // Admin buttons (demo actions)
  document.getElementById('registerBusinessBtn').onclick = async () => {
    try {
      const result = await callApi('/api/gov/company-registration', { business_name: "Demo Business", tax_id: "123456" });
      alert('Business registered: ' + JSON.stringify(result));
    } catch(e) { alert(e); }
  };
  document.getElementById('activateAllModulesBtn').onclick = () => alert('All modules are active (demo)');
  document.getElementById('activateSingleSystemBtn').onclick = () => alert('System activation demo – would call /api/system/create');
  document.getElementById('checkEnabledModulesBtn').onclick = () => alert('All 16 modules are enabled');
  document.getElementById('enableMissingModulesBtn').onclick = () => alert('No missing modules');
</script>
</body>
</html>
