<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - BaKangombe</title>
  <style>
    body { background: #0a0c10; color: #eef2ff; font-family: system-ui; padding: 2rem; max-width: 1200px; margin: 0 auto; }
    input, button, textarea, select { background: #0f1117; border: 1px solid rgba(255,255,255,0.1); color: #eef2ff; padding: 0.5rem; border-radius: 0.5rem; margin: 0.5rem 0; }
    button { background: #4f46e5; cursor: pointer; }
    pre { background: #0f1117; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; }
    .card { background: rgba(255,255,255,0.03); border-radius: 1rem; padding: 1rem; margin: 1rem 0; }
    hr { border-color: rgba(255,255,255,0.1); }
    .feedback-item { border-left: 3px solid #4f46e5; margin-bottom: 1rem; padding: 1rem; background: rgba(255,255,255,0.02); }
    .delete-btn { background: #dc2626; margin-left: 1rem; }
    .replies { margin-top: 0.5rem; padding-left: 1rem; border-left: 2px solid #10b981; font-size: 0.9rem; }
    .pagination { display: flex; gap: 1rem; margin-top: 1rem; align-items: center; }
    .error { color: #f87171; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>BaKangombe Admin Panel</h1>
  <div id="loginSection">
    <h2>Admin Login</h2>
    <input type="email" id="adminEmail" placeholder="Your admin email" value="bornface.kangombe@cs.unza.zm">
    <button onclick="login()">Login with Email</button>
    <div id="loginResult" class="error"></div>
  </div>
  <div id="adminContent" style="display:none;">
    <hr>
    <button id="logoutBtn" style="background:#dc2626; margin-bottom:1rem;">🚪 Logout</button>
    <h2>Feedback Management</h2>
    <button onclick="loadFeedback()">Refresh Feedback</button>
    <div id="feedbackList"></div>
    <div class="pagination" id="pagination"></div>
    <hr>
    <h3>Reply to Feedback</h3>
    <input type="number" id="replyId" placeholder="Feedback ID">
    <input type="email" id="replyUserEmail" placeholder="User email">
    <input type="text" id="replyUserName" placeholder="User name">
    <textarea id="replyMessage" rows="3" placeholder="Your reply..."></textarea>
    <button onclick="sendReply()">Send Reply</button>
    <div id="replyResult"></div>
  </div>
  <script>
    let token = localStorage.getItem('adminToken');
    let allFeedback = [];
    let currentPage = 1;
    const pageSize = 10;

    // Helper to handle API calls with token and 401 handling
    async function fetchWithAuth(url, options = {}) {
      const headers = { ...options.headers, 'Authorization': 'Bearer ' + token };
      const res = await fetch(url, { ...options, headers });
      if (res.status === 401) {
        // Token expired or invalid – logout
        localStorage.removeItem('adminToken');
        token = null;
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('adminContent').style.display = 'none';
        alert('Session expired. Please log in again.');
        return null;
      }
      return res;
    }

    if (token) { 
      // Try to load feedback to validate token, otherwise auto‑logout
      fetchWithAuth('/api/admin/feedback').then(res => {
        if (res && res.ok) {
          showAdminPanel();
          loadFeedback();
        } else {
          localStorage.removeItem('adminToken');
          token = null;
          document.getElementById('loginSection').style.display = 'block';
        }
      }).catch(() => {
        localStorage.removeItem('adminToken');
        token = null;
        document.getElementById('loginSection').style.display = 'block';
      });
    }

    async function login() {
      const email = document.getElementById('adminEmail').value;
      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('adminToken', data.token);
          token = data.token;
          showAdminPanel();
          loadFeedback();
        } else {
          document.getElementById('loginResult').innerText = 'Error: ' + (data.error || 'Login failed');
        }
      } catch (err) {
        document.getElementById('loginResult').innerText = 'Network error: ' + err.message;
      }
    }

    function showAdminPanel() {
      document.getElementById('loginSection').style.display = 'none';
      document.getElementById('adminContent').style.display = 'block';
    }

    async function loadFeedback() {
      const res = await fetchWithAuth('/api/admin/feedback');
      if (!res) return;
      if (res.ok) {
        const data = await res.json();
        allFeedback = data.feedback || [];
        currentPage = 1;
        renderFeedback();
      } else {
        console.error('Failed to load feedback');
      }
    }

    async function deleteFeedback(id) {
      if (!confirm('Are you sure you want to delete this feedback? Replies will also be deleted.')) return;
      const res = await fetchWithAuth(`/api/admin/feedback/${id}`, { method: 'DELETE' });
      if (res && res.ok) {
        loadFeedback();
      } else {
        alert('Delete failed');
      }
    }

    async function viewReplies(feedbackId, elementId) {
      const res = await fetchWithAuth(`/api/admin/feedback/${feedbackId}/responses`);
      if (!res) return;
      const data = await res.json();
      const repliesDiv = document.getElementById(elementId);
      if (data.responses && data.responses.length) {
        repliesDiv.innerHTML = '<strong>Previous replies:</strong><br>' + data.responses.map(r => `<div>📧 ${r.replied_by} (${new Date(r.created_at).toLocaleString()}): ${r.reply_message}</div>`).join('');
      } else {
        repliesDiv.innerHTML = '<em>No previous replies.</em>';
      }
    }

    function renderFeedback() {
      const start = (currentPage - 1) * pageSize;
      const pageItems = allFeedback.slice(start, start + pageSize);
      const container = document.getElementById('feedbackList');
      container.innerHTML = '';
      for (let fb of pageItems) {
        const div = document.createElement('div');
        div.className = 'feedback-item';
        div.innerHTML = `
          <strong>ID ${fb.id}</strong> - ${fb.name} (${fb.email})<br>
          <em>${new Date(fb.created_at).toLocaleString()}</em><br>
          Message: ${fb.message}<br>
          <button onclick="deleteFeedback(${fb.id})" class="delete-btn">🗑 Delete</button>
          <button onclick="viewReplies(${fb.id}, 'replies-${fb.id}')">💬 Show Replies</button>
          <div id="replies-${fb.id}" class="replies"></div>
        `;
        container.appendChild(div);
      }
      const totalPages = Math.ceil(allFeedback.length / pageSize);
      const pagDiv = document.getElementById('pagination');
      pagDiv.innerHTML = `
        <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Previous</button>
        <span>Page ${currentPage} of ${totalPages || 1}</span>
        <button onclick="changePage(1)" ${currentPage === totalPages || totalPages === 0 ? 'disabled' : ''}>Next</button>
      `;
    }

    function changePage(delta) {
      currentPage += delta;
      renderFeedback();
    }

    async function sendReply() {
      const feedbackId = parseInt(document.getElementById('replyId').value);
      const userEmail = document.getElementById('replyUserEmail').value;
      const userName = document.getElementById('replyUserName').value;
      const replyMessage = document.getElementById('replyMessage').value;
      if (!feedbackId || !userEmail || !replyMessage) {
        alert('Feedback ID, user email, and reply message are required.');
        return;
      }
      const res = await fetchWithAuth('/api/admin/respond', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ feedbackId, replyMessage, userEmail, userName })
      });
      if (res && res.ok) {
        const data = await res.json();
        document.getElementById('replyResult').innerText = JSON.stringify(data);
        document.getElementById('replyId').value = '';
        document.getElementById('replyUserEmail').value = '';
        document.getElementById('replyUserName').value = '';
        document.getElementById('replyMessage').value = '';
        loadFeedback();
      } else if (res) {
        const err = await res.text();
        document.getElementById('replyResult').innerText = 'Error: ' + err;
      }
    }

    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      localStorage.removeItem('adminToken');
      token = null;
      location.reload();
    });
  </script>
</body>
</html>
